[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i-program"
version = "1.0.0"
description = "I Programming Language - The world's first professional programming language designed around Kinyarwanda"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Irabizi Paisible Valentin", email = "irabizipaisiblevalentin@gmail.com"}
]
keywords = [
    "programming-language",
    "compiler",
    "kinyarwanda",
    "africa",
    "education",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/irabizipaisiblevalentin/I"
Documentation = "https://github.com/irabizipaisiblevalentin/I/tree/main/docs"
Repository = "https://github.com/irabizipaisiblevalentin/I"
Issues = "https://github.com/irabizipaisiblevalentin/I/issues"

[project.scripts]
i = "compiler.compiler:main"
isoko = "isoko.cli:main"
istudio = "istudio.itegeko:main"
istudio-desktop = "istudio.desktop:main"
istudio-ide = "istudio.ide.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compiler*", "vm*", "isoko*", "ufa*", "urubuga*", "ibiro*", "mobile*", "uam*", "ububiko*", "ubwenge*", "imikino*", "sisitemu*", "igicu*", "istudio*", "ideveloper*", "stdlib*"]

[tool.setuptools.package-data]
"compiler" = ["py.typed"]
"vm" = ["py.typed"]
"stdlib" = ["*.i"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers --disable-warnings"
pythonpath = ["src"]
importmode = "importlib"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "regression: Regression tests",
    "performance: Performance tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = false
disallow_any_unimported = false

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
