name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Run ruff linter (critical rules)
        continue-on-error: true
        run: ruff check src/compiler/ src/vm/ --select F,E9
      - name: Run mypy
        continue-on-error: true
        run: mypy src/compiler/ src/vm/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
      - name: Build wheel
        run: pip wheel . --no-deps -w dist
      - name: Verify wheel contains packages
        run: |
          python - <<'EOF'
          import glob
          import zipfile
          wheel = glob.glob("dist/*.whl")[0]
          expected = {
              "compiler", "vm", "isoko", "ufa", "urubuga", "ibiro", "mobile",
              "uam", "ububiko", "ubwenge", "imikino", "sisitemu", "igicu",
              "istudio", "stdlib",
          }
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())
          top = {n.split("/")[0] for n in names if "/" in n}
          missing = expected - top
          assert not missing, f"Wheel missing packages: {sorted(missing)}"
          print(f"Wheel {wheel} contains all {len(expected)} packages")
          EOF

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
            pytest-args: --cov=src/compiler --cov=src/vm --cov-report=xml
          - os: ubuntu-latest
            python-version: '3.11'
            pytest-args: --cov=src/compiler --cov=src/vm --cov-report=xml
          - os: ubuntu-latest
            python-version: '3.12'
            pytest-args: --cov=src/compiler --cov=src/vm --cov-report=xml
          - os: windows-latest
            python-version: '3.12'
            pytest-args: --cov=src/compiler --cov=src/vm --cov-report=xml
          - os: macos-latest
            python-version: '3.11'
            pytest-args: ''
    runs-on: ${{ matrix.os }}
    env:
      PYTHONMALLOC: malloc
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest ${{ matrix.pytest-args }}
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run e2e CLI tests
        run: pytest tests/e2e/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run bandit
        run: bandit -r src/ -q || true
      - name: Run safety
        run: safety check || true
